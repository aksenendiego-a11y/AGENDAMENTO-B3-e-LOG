services:
  - type: web
    name: sad-logistica
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: local
      - key: TOKEN_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sad-logistica-db
          property: connectionString

databases:
  - name: sad-logistica-db
    plan: free
    databaseName: sad_logistica
    user: sad_user
