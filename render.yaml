services:
  - type: web
    name: sad-logistica
    env: docker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: local
      - key: TOKEN_SECRET
        value: 7dKeYRQo6BX0KprNyBhl7nzeUpS1fn1fRAAK81PH+64=
      - key: DATABASE_URL
        fromDatabase:
          name: sad-logistica-db
          property: connectionString

databases:
  - name: sad-logistica-db
    plan: free
    databaseName: sad_logistica
    user: sad_user
