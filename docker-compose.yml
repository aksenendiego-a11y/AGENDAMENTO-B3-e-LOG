services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sad_logistica
      POSTGRES_USER: sad_test
      POSTGRES_PASSWORD: sad_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sad_test -d sad_logistica"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - sad_logistica_pg:/var/lib/postgresql/data
volumes:
  sad_logistica_pg:
